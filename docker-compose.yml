services:
  mongodb:
    image: mongo:7.0
    container_name: proterra-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - proterra-data:/data/db
    networks:
      - proterra-network

volumes:
  proterra-data:
    driver: local

networks:
  proterra-network:
    driver: bridge
